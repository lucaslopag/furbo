services:
  acestream:
    image: magnetikonline/acestream-server:latest
    container_name: acestream
    restart: unless-stopped
    network_mode: host      # Necesario para que el motor P2P acceda a peers externos
    command: ["--client-console"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6878/webui/api/service?method=get_version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
